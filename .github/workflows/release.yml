name: Latest macOS Release

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      RELEASE_TAG: latest
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and test
        run: |
          swift build
          swift test

      - name: Package app
        run: |
          ./scripts/build-app.sh
          ditto -c -k --sequesterRsrc --keepParent \
            dist/CodexCredit.app \
            "CodexCredit-${RELEASE_TAG}-macOS.zip"

      - name: Verify package
        run: |
          test -x dist/CodexCredit.app/Contents/MacOS/CodexCredit
          test -f dist/CodexCredit.app/Contents/Info.plist
          unzip -t "CodexCredit-${RELEASE_TAG}-macOS.zip"

      - name: Create or update rolling release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="$COMMIT_SHA" \
              -F force=true
          else
            gh release create "$RELEASE_TAG" \
              --target "$COMMIT_SHA" \
              --title "Latest Build" \
              --prerelease \
              --notes "自动构建自提交 ${COMMIT_SHA}。"
          fi

          gh release upload "$RELEASE_TAG" \
            "CodexCredit-${RELEASE_TAG}-macOS.zip" \
            --clobber
