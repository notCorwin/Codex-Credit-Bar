name: Autobuild macOS Release

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: autobuild-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      RELEASE_TAG: autobuild
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and test
        run: |
          swift build
          swift test

      - name: Package app asset
        run: |
          APP_REVISION="$GITHUB_SHA" ./scripts/build-app.sh
          # GitHub Release assets must be single files. Keep the bundle uncompressed
          # in a tar stream while retaining the requested CodexCredit.app asset name.
          tar -cf CodexCredit.app -C dist CodexCredit.app

      - name: Verify package
        run: |
          test -x dist/CodexCredit.app/Contents/MacOS/CodexCredit
          test -f dist/CodexCredit.app/Contents/Info.plist
          test -f CodexCredit.app
          tar -tf CodexCredit.app | grep -qx "CodexCredit.app/Contents/MacOS/CodexCredit"

      - name: Create or update autobuild Release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="$COMMIT_SHA" \
              -F force=true
            gh release edit "$RELEASE_TAG" \
              --title "autobuild" \
              --latest \
              --prerelease=false \
              --notes "自动构建自提交 ${COMMIT_SHA}。"
          else
            gh release create "$RELEASE_TAG" \
              --target "$COMMIT_SHA" \
              --title "autobuild" \
              --latest \
              --notes "自动构建自提交 ${COMMIT_SHA}。"
          fi

          gh release upload "$RELEASE_TAG" CodexCredit.app --clobber
