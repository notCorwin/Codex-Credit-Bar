name: Autobuild macOS Release

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: autobuild-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      RELEASE_TAG: autobuild
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build and test
        run: |
          swift build
          swift test

      - name: Package app asset
        run: |
          APP_REVISION="$GITHUB_SHA" ./scripts/build-app.sh
          # GitHub Release assets must be single files. Keep the bundle uncompressed
          # GitHub rejects the .app extension for Release assets. Use an
          # uncompressed tar stream and expose CodexCredit.app as its display label.
          tar -cf CodexCredit.app.tar -C dist CodexCredit.app

      - name: Verify package
        run: |
          test -x dist/CodexCredit.app/Contents/MacOS/CodexCredit
          test -f dist/CodexCredit.app/Contents/Info.plist
          test -f CodexCredit.app.tar
          tar -tf CodexCredit.app.tar | grep -qx "CodexCredit.app/Contents/MacOS/CodexCredit"

      - name: Create or update autobuild Release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="$COMMIT_SHA" \
              -F force=true
            gh release edit "$RELEASE_TAG" \
              --title "autobuild" \
              --latest \
              --prerelease=false \
              --notes "自动构建自提交 ${COMMIT_SHA}。"
          else
            gh release create "$RELEASE_TAG" \
              --target "$COMMIT_SHA" \
              --title "autobuild" \
              --latest \
              --notes "自动构建自提交 ${COMMIT_SHA}。"
          fi

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          asset_ids="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            --jq '.[] | select(.name == "CodexCredit.app.tar" or .name == "CodexCredit.app") | .id' || true)"
          for asset_id in $asset_ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

          curl --fail --silent --show-error \
            -X POST \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=CodexCredit.app.tar&label=CodexCredit.app" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/x-tar" \
            --data-binary @CodexCredit.app.tar

          asset_count="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            --jq '[.[] | select(.name == "CodexCredit.app.tar" and .label == "CodexCredit.app")] | length')"
          [[ "$asset_count" == "1" ]]
