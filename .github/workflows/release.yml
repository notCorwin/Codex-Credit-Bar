name: Autobuild macOS Release

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: autobuild-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      RELEASE_TAG: autobuild
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build and test
        run: |
          swift build
          swift test

      - name: Package app asset
        run: |
          APP_REVISION="$GITHUB_SHA" ./scripts/build-app.sh
          # GitHub Release assets must be single files. Keep the bundle uncompressed
          # GitHub rejects the .app extension for Release assets. Use an
          # uncompressed tar stream and expose CodexCredit.app as its display label.
          tar -cf CodexCredit.app.tar -C dist CodexCredit.app

      - name: Verify package
        run: |
          test -x dist/CodexCredit.app/Contents/MacOS/CodexCredit
          test -f dist/CodexCredit.app/Contents/Info.plist
          test -f CodexCredit.app.tar
          tar -tf CodexCredit.app.tar | grep -qx "CodexCredit.app/Contents/MacOS/CodexCredit"

      - name: Replace autobuild Release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Editing a release keeps its original published_at. Delete and recreate
          # it so the fixed autobuild release always gets the current timestamp.
          if release_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.id' 2>/dev/null)"; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          fi

          # A release deletion does not delete its tag, so move the tag explicitly
          # before creating the replacement release at the current commit.
          if gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="$COMMIT_SHA" \
              -F force=true
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$COMMIT_SHA"
          fi

          gh release create "$RELEASE_TAG" \
            --target "$COMMIT_SHA" \
            --title "autobuild" \
            --latest \
            --notes "自动构建自提交 ${COMMIT_SHA}。"

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          [[ "$tag_sha" == "$COMMIT_SHA" ]]

          curl --fail --silent --show-error \
            -X POST \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=CodexCredit.app.tar&label=CodexCredit.app" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/x-tar" \
            --data-binary @CodexCredit.app.tar

          asset_count="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" \
            --jq '[.[] | select(.name == "CodexCredit.app.tar" and .label == "CodexCredit.app")] | length')"
          [[ "$asset_count" == "1" ]]
