name: Autobuild macOS Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: autobuild-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build and test
        run: |
          swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Package and verify app
        shell: bash
        run: |
          APP_REVISION="$GITHUB_SHA" ./scripts/build-app.sh
          app='dist/Codex Credit Bar.app'
          test -x "$app/Contents/MacOS/CodexMenuBarCredit"
          test -f "$app/Contents/Resources/Codex Credit Bar.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.codexmenubarcredit.menu-bar
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSourceRevision' "$app/Contents/Info.plist")" = "$GITHUB_SHA"
          tar -cf Codex.Credit.Bar.app.tar -C dist 'Codex Credit Bar.app'
          tar -tf Codex.Credit.Bar.app.tar | grep -qx 'Codex Credit Bar.app/Contents/MacOS/CodexMenuBarCredit'
          sha256="$(shasum -a 256 Codex.Credit.Bar.app.tar | cut -d' ' -f1)"
          built_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          printf '{"revision":"%s","asset_url":"https://github.com/notCorwin/Codex-Credit-Bar/releases/download/autobuild/Codex.Credit.Bar.app.tar","digest":"sha256:%s","published_at":"%s"}\n' \
            "$GITHUB_SHA" "$sha256" "$built_at" > update.json
          printf 'Latest automatic build from `main`. This release is replaced after each successful build.\n\n[Download Codex Credit Bar](https://github.com/notCorwin/Codex-Credit-Bar/releases/download/autobuild/Codex.Credit.Bar.app.tar)\n\nCommit: [%s](https://github.com/notCorwin/Codex-Credit-Bar/commit/%s)\n\nBuilt at: %s (UTC)\n' \
            "$GITHUB_SHA" "$GITHUB_SHA" "$built_at" > release-notes.md

      - name: Publish autobuild release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view autobuild >/dev/null 2>&1; then
            gh release create autobuild --target "$GITHUB_SHA" --title autobuild --latest \
              --notes-file release-notes.md
          fi
          gh release upload autobuild 'Codex.Credit.Bar.app.tar#Codex Credit Bar.app' --clobber
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/autobuild" \
            --jq '[.assets[] | select(.name == "Codex.Credit.Bar.app.tar")] | .[0].digest')"
          if [[ "$digest" != "sha256:$(shasum -a 256 Codex.Credit.Bar.app.tar | cut -d' ' -f1)" ]]; then
            echo 'Uploaded app digest does not match the build.' >&2
            exit 1
          fi
          gh release upload autobuild update.json --clobber
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/autobuild" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit autobuild --target "$GITHUB_SHA" --title autobuild --latest \
            --notes-file release-notes.md
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/autobuild" --jq .id)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" --paginate |
            jq -r '.[] | select(.name != "Codex.Credit.Bar.app.tar" and .name != "update.json") | .id' |
            while read -r asset_id; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
            done
